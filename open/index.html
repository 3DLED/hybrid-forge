<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid Forge: shared with you</title>
<meta name="description" content="A workout or plan shared from Hybrid Forge.">
<!-- A link page, not a page to be found: it only means something with a code's #f1.… on the end. -->
<meta name="robots" content="noindex">
<!--
  Self-contained like the rest of the site: no fonts, scripts or images fetched from anywhere.
  The workout or plan is the part of the address after #, which browsers never send to the
  server, so this site never receives it. The script below reads it here, in the browser, only to
  say what it is; the Open button hands it to the app.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f1;
    --surface: #ffffff;
    --text: #13150f;
    --muted: #595d52;
    --rule: #dcdfd4;
    --accent: #4b6b00;
    --accent-mark: #d4ff3f;
    --button-text: #13150f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #0c0c0f;
      --text: #ffffff;
      --muted: #a3a3ad;
      --rule: #2b2b34;
      --accent: #d4ff3f;
      --accent-mark: #d4ff3f;
      --button-text: #000000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #0c0c0f;
    --text: #ffffff;
    --muted: #a3a3ad;
    --rule: #2b2b34;
    --accent: #d4ff3f;
    --accent-mark: #d4ff3f;
    --button-text: #000000;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 68ch;
    margin: 0 auto;
    padding: 56px 16px 72px;
  }
  .eyebrow {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 10px;
    border-radius: 2px;
    background: var(--accent-mark);
    vertical-align: 0;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 7vw, 42px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  .what { margin: 0 0 32px; font-size: 19px; color: var(--muted); }
  .open {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    background: var(--accent-mark);
    color: var(--button-text);
    font-weight: 700;
    font-size: 18px;
    text-align: center;
    text-decoration: none;
  }
  .open:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .note { margin: 12px 0 40px; font-size: 15px; color: var(--muted); }
  .get {
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
  }
  .get h2 {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  p { margin: 0; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Hybrid Forge</p>
  <h1 id="title">Shared with you</h1>
  <p class="what" id="what">A workout or plan from Hybrid Forge, a training app for people who lift and run.</p>

  <a class="open" id="open" href="forge://open">Open in Hybrid Forge</a>
  <p class="note" id="note">Nothing happens? Then the app isn't on this phone yet.</p>

  <div class="get">
    <h2 id="get-title">Get Hybrid Forge</h2>
    <p id="get-text">Free to try on iPhone and Android. <a id="get-link" href="../">How to get it</a>, then come back and tap Open.</p>
  </div>
</main>
<script>
  (function () {
    var spanish = /^es\b/i.test(navigator.language || '');
    var words = spanish
      ? {
          lang: 'es',
          title: 'Compartido contigo',
          what: 'Un entrenamiento o un plan de Hybrid Forge, una app de entrenamiento para quienes levantan pesas y corren.',
          open: 'Abrir en Hybrid Forge',
          note: '¿No pasa nada? Entonces la app todavía no está en este teléfono.',
          getTitle: 'Consigue Hybrid Forge',
          getText: 'Gratis para probar en iPhone y Android. ',
          getLink: 'Cómo conseguirla',
          getAfter: ', y después vuelve aquí y toca Abrir.',
          home: '../es/',
          workout: function (n) { return 'Un entrenamiento' + (n ? ' · ' + n + (n === 1 ? ' ejercicio' : ' ejercicios') : ''); },
          plan: function (weeks, n) { return 'Un plan' + (weeks ? ' · ' + weeks + (weeks === 1 ? ' semana' : ' semanas') : '') + (n ? ' · ' + n + (n === 1 ? ' entrenamiento' : ' entrenamientos') : ''); },
          plans: function (n) { return n === 1 ? 'Un plan, listo para empezar' : n + ' planes, listos para empezar'; }
        }
      : {
          lang: 'en',
          title: 'Shared with you',
          what: 'A workout or plan from Hybrid Forge, a training app for people who lift and run.',
          open: 'Open in Hybrid Forge',
          note: "Nothing happens? Then the app isn't on this phone yet.",
          getTitle: 'Get Hybrid Forge',
          getText: 'Free to try on iPhone and Android. ',
          getLink: 'How to get it',
          getAfter: ', then come back and tap Open.',
          home: '../',
          workout: function (n) { return 'A workout' + (n ? ' · ' + n + (n === 1 ? ' movement' : ' movements') : ''); },
          plan: function (weeks, n) { return 'A plan' + (weeks ? ' · ' + weeks + (weeks === 1 ? ' week' : ' weeks') : '') + (n ? ' · ' + n + (n === 1 ? ' workout' : ' workouts') : ''); },
          plans: function (n) { return n === 1 ? 'A plan, ready to start' : n + ' plans, ready to start'; }
        };

    var byId = function (id) { return document.getElementById(id); };
    document.documentElement.lang = words.lang;
    byId('open').textContent = words.open;
    byId('note').textContent = words.note;
    byId('get-title').textContent = words.getTitle;
    var getText = byId('get-text');
    getText.textContent = words.getText;
    var link = document.createElement('a');
    link.href = words.home;
    link.textContent = words.getLink;
    getText.appendChild(link);
    getText.appendChild(document.createTextNode(words.getAfter));
    byId('title').textContent = words.title;
    byId('what').textContent = words.what;

    var code = location.hash;
    if (code.indexOf('#f1.') !== 0) return;
    byId('open').href = 'forge://open' + code;

    // What it is, read here and only to say so. Nothing is sent anywhere.
    if (typeof DecompressionStream === 'undefined') return;
    try {
      var data = code.slice(4).replace(/-/g, '+').replace(/_/g, '/');
      var binary = atob(data + '==='.slice((data.length + 3) % 4));
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      new Response(stream).text().then(function (text) {
        var file = JSON.parse(text);
        if (file.app !== 'forge') return;
        var count = function (blocks) {
          return (blocks || []).reduce(function (sum, block) { return sum + ((block && block.items) || []).length; }, 0);
        };
        if (file.kind === 'workout' && file.workout) {
          byId('title').textContent = file.workout.name;
          byId('what').textContent = words.workout(count(file.workout.blocks));
        } else if (file.kind === 'plan' && file.plan) {
          byId('title').textContent = file.plan.name;
          byId('what').textContent = words.plan(file.plan.weeks, (file.plan.sessions || []).length);
        } else if (file.kind === 'bundle' && file.bundle && file.bundle.plans && file.bundle.plans.length) {
          byId('title').textContent = file.bundle.plans.map(function (plan) { return plan.name; }).join(' · ');
          byId('what').textContent = words.plans(file.bundle.plans.length);
        }
      }).catch(function () {});
    } catch (e) {
      // An unreadable code still opens in the app, which says what is wrong with it.
    }
  })();
</script>
</body>
</html>
